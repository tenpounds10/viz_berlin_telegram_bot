name: Verkehrsinformation_to_telegram_bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # runs every 5 minutes

jobs:
  send-updates:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # needed to commit last_seen.txt back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit last_seen.txt if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen.txt
          git diff --cached --quiet || git commit -m "chore: update last_seen [skip ci]"
          git push
